<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mein Personal Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            500: '#06b6d4',
                            600: '#0891b2',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .glass {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .dark .glass {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-300 font-sans p-4 sm:p-8 flex flex-col justify-between">

    <!-- Header with Controls -->
    <header class="flex justify-between items-center w-full max-w-6xl mx-auto mb-6">
        <div class="flex items-center gap-2">
            <i data-lucide="layout-dashboard" class="w-6 h-6 text-cyan-500"></i>
            <span class="font-bold text-lg tracking-wide">Dashboard</span>
        </div>
        <button id="themeToggleBtn" class="glass p-2.5 rounded-xl hover:scale-105 active:scale-95 transition-transform flex items-center justify-center shadow-sm">
            <i id="themeIcon" data-lucide="moon" class="w-5 h-5 text-slate-700 dark:text-amber-400"></i>
        </button>
    </header>

    <!-- Main Content Area -->
    <main class="w-full max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-12 gap-6 my-auto">

        <!-- Hero Section: Clock, Date, Search & Weather -->
        <section class="md:col-span-12 glass rounded-3xl p-6 sm:p-10 flex flex-col items-center justify-center text-center shadow-lg relative overflow-hidden">
            <!-- Greeting & Time -->
            <p id="greetingText" class="text-sm sm:text-base font-semibold text-cyan-600 dark:text-cyan-400 uppercase tracking-widest mb-1">Guten Tag</p>
            <h1 id="timeText" class="text-5xl sm:text-7xl font-extrabold tracking-tight my-2 font-mono">00:00:00</h1>
            <p id="dateText" class="text-slate-500 dark:text-slate-400 text-sm sm:text-base font-medium mb-6">Montag, 1. Januar 2026</p>

            <!-- Search Bar -->
            <form id="searchForm" class="w-full max-w-xl flex flex-col sm:flex-row gap-2 relative">
                <div class="relative flex-grow">
                    <i data-lucide="search" class="w-5 h-5 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="searchInput" placeholder="Suchen oder Web-Adresse eingeben..." required class="w-full pl-11 pr-4 py-3 rounded-2xl bg-white/70 dark:bg-slate-900/70 border border-slate-200 dark:border-slate-800 focus:outline-none focus:ring-2 focus:ring-cyan-500 text-sm shadow-inner transition">
                </div>
                <div class="flex gap-2">
                    <select id="searchEngine" class="px-3 py-3 rounded-2xl bg-white/70 dark:bg-slate-900/70 border border-slate-200 dark:border-slate-800 focus:outline-none text-xs sm:text-sm font-medium cursor-pointer">
                        <option value="google">Google</option>
                        <option value="duckduckgo">DuckDuckGo</option>
                        <option value="wikipedia">Wikipedia</option>
                    </select>
                    <button type="submit" class="px-5 py-3 bg-cyan-500 hover:bg-cyan-600 active:scale-95 text-white rounded-2xl font-medium text-sm transition shadow-md">
                        Suchen
                    </button>
                </div>
            </form>
        </section>

        <!-- Bookmarks Grid -->
        <section class="md:col-span-7 glass rounded-3xl p-6 flex flex-col justify-between shadow-lg">
            <div>
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold flex items-center gap-2">
                        <i data-lucide="bookmark" class="w-5 h-5 text-cyan-500"></i> Lesezeichen
                    </h2>
                    <button id="addBookmarkBtn" class="text-xs bg-cyan-500/10 hover:bg-cyan-500/20 text-cyan-600 dark:text-cyan-400 px-3 py-1.5 rounded-xl font-medium transition flex items-center gap-1">
                        <i data-lucide="plus" class="w-4 h-4"></i> Hinzufügen
                    </button>
                </div>
                <div id="bookmarksGrid" class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                    <!-- Dynamic Links injected via JS -->
                </div>
            </div>
        </section>

        <!-- Right Column: Weather & Notes -->
        <section class="md:col-span-5 flex flex-col gap-6">
            <!-- Weather Card -->
            <div class="glass rounded-3xl p-5 shadow-lg flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="p-3 bg-amber-500/10 rounded-2xl text-amber-500">
                        <i data-lucide="sun" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <div class="flex items-center gap-1">
                            <span id="weatherCity" class="font-bold text-sm">Berlin</span>
                            <button id="editCityBtn" class="text-xs text-slate-400 hover:text-cyan-500"><i data-lucide="edit-3" class="w-3 h-3"></i></button>
                        </div>
                        <p id="weatherDesc" class="text-xs text-slate-500 dark:text-slate-400">Sonnig</p>
                    </div>
                </div>
                <div class="text-right">
                    <span id="weatherTemp" class="text-2xl font-black">22°C</span>
                </div>
            </div>

            <!-- Notes Widget -->
            <div class="glass rounded-3xl p-5 shadow-lg flex-grow flex flex-col">
                <div class="flex justify-between items-center mb-2">
                    <h2 class="text-sm font-bold flex items-center gap-2">
                        <i data-lucide="file-text" class="w-4 h-4 text-cyan-500"></i> Schnelle Notizen
                    </h2>
                    <span id="noteSaveStatus" class="text-[10px] text-slate-400 opacity-0 transition-opacity">Gespeichert</span>
                </div>
                <textarea id="notesArea" placeholder="Schreibe hier deine Gedanken oder Aufgaben auf..." class="w-full h-32 md:h-full min-h-[100px] p-3 rounded-2xl bg-white/50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-800 focus:outline-none focus:ring-2 focus:ring-cyan-500 text-xs resize-none transition"></textarea>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="w-full max-w-6xl mx-auto mt-6 text-center text-xs text-slate-400">
        <p>Gehostet auf GitHub Pages • Einstellungen lokal gespeichert</p>
    </footer>

    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        // DOM Elements
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const themeIcon = document.getElementById('themeIcon');
        const timeText = document.getElementById('timeText');
        const dateText = document.getElementById('dateText');
        const greetingText = document.getElementById('greetingText');
        const searchForm = document.getElementById('searchForm');
        const searchInput = document.getElementById('searchInput');
        const searchEngine = document.getElementById('searchEngine');
        const bookmarksGrid = document.getElementById('bookmarksGrid');
        const addBookmarkBtn = document.getElementById('addBookmarkBtn');
        const notesArea = document.getElementById('notesArea');
        const noteSaveStatus = document.getElementById('noteSaveStatus');
        const weatherCity = document.getElementById('weatherCity');
        const weatherTemp = document.getElementById('weatherTemp');
        const weatherDesc = document.getElementById('weatherDesc');
        const editCityBtn = document.getElementById('editCityBtn');

        // --- Theme Management ---
        function initTheme() {
            const savedTheme = localStorage.getItem('dash_theme');
            if (savedTheme === 'light') {
                document.documentElement.classList.remove('dark');
                themeIcon.setAttribute('data-lucide', 'sun');
            } else {
                document.documentElement.classList.add('dark');
                themeIcon.setAttribute('data-lucide', 'moon');
            }
            lucide.createIcons();
        }

        themeToggleBtn.addEventListener('click', () => {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('dash_theme', isDark ? 'dark' : 'light');
            themeIcon.setAttribute('data-lucide', isDark ? 'moon' : 'sun');
            lucide.createIcons();
        });

        // --- Clock & Date & Greeting ---
        function updateClock() {
            const now = new Date();
            timeText.textContent = now.toLocaleTimeString('de-DE');
            
            const options = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
            dateText.textContent = now.toLocaleDateString('de-DE', options);

            const hours = now.getHours();
            if (hours < 12) greetingText.textContent = 'Guten Morgen';
            else if (hours < 18) greetingText.textContent = 'Guten Tag';
            else greetingText.textContent = 'Guten Abend';
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- Search Engine Handling ---
        searchForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const query = searchInput.value.trim();
            if (!query) return;

            const engine = searchEngine.value;
            let url = '';

            if (engine === 'google') url = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
            else if (engine === 'duckduckgo') url = `https://duckduckgo.com/?q=${encodeURIComponent(query)}`;
            else if (engine === 'wikipedia') url = `https://de.wikipedia.org/wiki/Spezial:Suche?search=${encodeURIComponent(query)}`;

            window.location.href = url;
        });

        // --- Bookmarks Management ---
        let defaultBookmarks = [
            { name: 'GitHub', url: 'https://github.com' },
            { name: 'YouTube', url: 'https://youtube.com' },
            { name: 'Wikipedia', url: 'https://wikipedia.org' },
            { name: 'Tagesschau', url: 'https://tagesschau.de' }
        ];

        function getBookmarks() {
            const saved = localStorage.getItem('dash_bookmarks');
            return saved ? JSON.parse(saved) : defaultBookmarks;
        }

        function saveBookmarks(bookmarks) {
            localStorage.setItem('dash_bookmarks', JSON.stringify(bookmarks));
            renderBookmarks();
        }

        function renderBookmarks() {
            const bookmarks = getBookmarks();
            bookmarksGrid.innerHTML = '';

            bookmarks.forEach((bm, index) => {
                const domain = new URL(bm.url).hostname;
                const faviconUrl = `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;

                const card = document.createElement('div');
                card.className = 'group relative glass rounded-2xl p-3 flex flex-col items-center justify-center gap-2 hover:bg-white/80 dark:hover:bg-slate-800/80 transition cursor-pointer shadow-sm';
                card.innerHTML = `
                    <a href="${bm.url}" target="_blank" class="flex flex-col items-center w-full">
                        <img src="${faviconUrl}" alt="${bm.name}" class="w-8 h-8 rounded-lg object-contain mb-1" onerror="this.src='https://placehold.co/32x32/0891b2/ffffff?text=${bm.name[0]}'">
                        <span class="text-xs font-semibold truncate w-full text-center">${bm.name}</span>
                    </a>
                    <button onclick="deleteBookmark(${index})" class="absolute top-1 right-1 opacity-0 group-hover:opacity-100 text-slate-400 hover:text-red-500 transition p-1">
                        <i data-lucide="x" class="w-3.5 h-3.5"></i>
                    </button>
                `;
                bookmarksGrid.appendChild(card);
            });
            lucide.createIcons();
        }

        addBookmarkBtn.addEventListener('click', () => {
            const name = prompt('Name des Lesezeichens:');
            let url = prompt('URL (z. B. https://example.com):');
            if (name && url) {
                if (!url.startsWith('http://') && !url.startsWith('https://')) {
                    url = 'https://' + url;
                }
                const bookmarks = getBookmarks();
                bookmarks.push({ name, url });
                saveBookmarks(bookmarks);
            }
        });

        window.deleteBookmark = function(index) {
            const bookmarks = getBookmarks();
            bookmarks.splice(index, 1);
            saveBookmarks(bookmarks);
        };

        // --- Notes Management ---
        function initNotes() {
            notesArea.value = localStorage.getItem('dash_notes') || '';
            notesArea.addEventListener('input', () => {
                localStorage.setItem('dash_notes', notesArea.value);
                noteSaveStatus.classList.remove('opacity-0');
                setTimeout(() => noteSaveStatus.classList.add('opacity-0'), 1500);
            });
        }

        // --- Weather Widget (Mock & Customizable) ---
        function initWeather() {
            const savedCity = localStorage.getItem('dash_weather_city') || 'Berlin';
            weatherCity.textContent = savedCity;

            // Simple random temperature generator based on city string length for demo interactivity
            const mockTemp = 18 + (savedCity.length % 8);
            weatherTemp.textContent = `${mockTemp}°C`;
        }

        editCityBtn.addEventListener('click', () => {
            const newCity = prompt('Gib deine Stadt ein:', weatherCity.textContent);
            if (newCity) {
                localStorage.setItem('dash_weather_city', newCity);
                initWeather();
            }
        });

        // Initial Calls
        initTheme();
        renderBookmarks();
        initNotes();
        initWeather();
    </script>
</body>
</html>
